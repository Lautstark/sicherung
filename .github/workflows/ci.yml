name: CI

on:
  push:
    branches: [main]
    # A tag is the release artifact for this package — consumers resolve
    # `#semver:` against these — so tags get the same gate as main.
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Fail before the slow steps if the tag and package.json disagree.
      - name: Tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          pkg="v$(npm pkg get version | tr -d '"')"
          if [ "$pkg" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME but package.json says $pkg"
            exit 1
          fi
          echo "$GITHUB_REF_NAME matches package.json"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      # "the inlet" in test/sicherung.test.ts asserts the API surface as an
      # allow-list. A failure there is a licensing question — a new way for
      # data to enter this module — not just a broken test.
      - run: npm test

      # Consumers install from git, so `prepare` runs on their machine.
      - run: npm run build
