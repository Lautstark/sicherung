name: CI

on:
  push:
    branches: [main]
    # Tags are cut by release.yml now, and a tag it pushes does not start
    # this workflow. The trigger stays for a tag somebody pushes by hand,
    # which is the one case the check below still has to catch.
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Fail before the slow steps if the tag and package.json disagree. Only
      # reachable by a hand-pushed tag since 2026-09-16; release.yml makes the
      # same check of the commit it tags.
      - name: Tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          pkg="v$(npm pkg get version | tr -d '"')"
          if [ "$pkg" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME but package.json says $pkg"
            exit 1
          fi
          echo "$GITHUB_REF_NAME matches package.json"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      # "the inlet" in test/sicherung.test.ts asserts the API surface as an
      # allow-list. A failure there is a licensing question — a new way for
      # data to enter this module — not just a broken test.
      - run: npm test

      # dist/ ships in the npm tarball, built by release.yml before it packs.
      # This is the same build, run here so a pull request cannot break it.
      - run: npm run build
